<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="195" viewBox="0 0 1200 195">
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .muted{fill:#94A3B8}
    .white{fill:#F8FAFC}
    .line{stroke:#334155;stroke-width:1}
    .accent{fill:url(#g)}
  </style>
</defs>
<rect width="100%" height="100%" fill="none"/>

<rect x="1" y="1" width="1198" height="190" rx="18" fill="#0B1120" stroke="#1E293B"/>
<text x="600" y="60" text-anchor="middle" class="mono muted" font-size="15">05 / CURRENT STATUS</text>
<text x="600" y="105" text-anchor="middle" class="sans white" font-size="28" font-weight="700">Always building. Always learning.</text>
<text x="600" y="140" text-anchor="middle" class="mono" font-size="15" fill="#CBD5E1">Open to software engineering opportunities, interesting projects, and good problems.</text>
<circle cx="600" cy="165" r="4" fill="#06B6D4"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>

</svg>