<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .muted{fill:#94A3B8}
    .white{fill:#F8FAFC}
    .line{stroke:#334155;stroke-width:1}
    .accent{fill:url(#g)}
  </style>
</defs>
<rect width="100%" height="100%" fill="none"/>

<rect x="1" y="1" width="1198" height="278" rx="18" fill="#0B1120" stroke="#1E293B"/>
<circle cx="34" cy="32" r="6" fill="#64748B"/><circle cx="56" cy="32" r="6" fill="#64748B"/><circle cx="78" cy="32" r="6" fill="#64748B"/>
<text x="46" y="105" class="mono muted" font-size="20">$ whoami</text>
<text x="46" y="155" class="sans white" font-size="50" font-weight="700">Md Rahbir Mahdi</text>
<text x="48" y="196" class="mono" font-size="20" fill="#CBD5E1">software engineer • builder • hackathon enthusiast</text>
<text x="48" y="232" class="mono" font-size="16" fill="#64748B">Toronto, Canada  //  turning ideas into working software</text>
<rect x="48" y="247" width="9" height="20" rx="2" fill="#06B6D4">
  <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
</rect>
<path d="M930 88 C1000 45 1100 55 1150 100 C1080 112 1040 154 1005 205 C965 168 950 130 930 88Z" fill="none" stroke="url(#g)" stroke-width="2" opacity=".8">
  <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="4s" repeatCount="indefinite"/>
</path>
<circle cx="1007" cy="130" r="5" fill="#06B6D4" filter="url(#glow)">
  <animate attributeName="cy" values="130;185;130" dur="3s" repeatCount="indefinite"/>
</circle>

</svg>