<text x="24" y="148" class="m small muted">York University · Toronto, Canada · Computer Systems Analyst @ ICM</text>

<line x1="24" y1="180" x2="1076" y2="180" class="soft"/>
<text x="24" y="208" class="m tiny muted">FOCUS</text>
<text x="115" y="208" class="m small ink">AI / SYSTEMS / FULL-STACK / MOBILE / C++</text>
<text x="24" y="236" class="m tiny muted">STATUS</text>
<text x="115" y="236" class="m small ink">building products · learning lower-level systems · open to SWE opportunities</text>
<text x="24" y="264" class="m tiny muted">STYLE</text>
<text x="115" y="264" class="m small ink">prototype quickly · debug deeply · finish the thing</text>

<line x1="24" y1="302" x2="1076" y2="302" class="rule"/>
<text x="24" y="330" class="m tiny muted">SIGNALS</text>
