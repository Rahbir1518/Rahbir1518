<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390">
<defs>
<style>
.m{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
.tiny{font-size:10px;letter-spacing:2.4px}.small{font-size:12px;letter-spacing:.5px}
.ink{fill:#111}.muted{fill:#666}.rule{stroke:#111;stroke-width:1}.soft{stroke:#aaa;stroke-width:1}
.node{fill:#fff;stroke:#111;stroke-width:1}
@keyframes dash{to{stroke-dashoffset:-90}}
.moving{animation:dash 3.2s linear infinite}
</style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>

<text x="24" y="34" class="m tiny ink">03&#160;&#160; SELECTED BUILDS</text>
<line x1="190" y1="28" x2="930" y2="28" class="rule"/>
<text x="965" y="33" class="m tiny muted">/03-PROJECTS</text>
<text x="24" y="64" class="m tiny muted">THREE BUILDS — DIFFERENT PROBLEMS, SAME BUILD LOOP</text>
<text x="1048" y="64" class="m tiny muted" text-anchor="end">FIG. 02</text>

<g>
<rect x="35" y="95" width="315" height="105" class="node"/>
<text x="55" y="122" class="m" font-size="24" font-weight="600" fill="#111">CLARUS</text>
<text x="55" y="147" class="m small muted">AI healthcare workflow engine</text>
<text x="55" y="169" class="m small ink">FastAPI · Next.js · React Flow</text>
<text x="55" y="188" class="m" font-size="9" fill="#777">Hack Canada 2026 · 2 awards</text>

<rect x="392" y="95" width="315" height="105" class="node"/>
<text x="412" y="122" class="m" font-size="24" font-weight="600" fill="#111">MIMICOO</text>
<text x="412" y="147" class="m small muted">infant babble analysis</text>
<text x="412" y="169" class="m small ink">MediaPipe · Librosa · Gemini</text>
<text x="412" y="188" class="m" font-size="9" fill="#777">Hack the Valley 2025 · JWT Award</text>

<rect x="750" y="95" width="315" height="105" class="node"/>
<text x="770" y="122" class="m" font-size="24" font-weight="600" fill="#111">VROOMI</text>
<text x="770" y="147" class="m small muted">student-first carpooling</text>
<text x="770" y="169" class="m small ink">React · TypeScript · Supabase</text>
<text x="770" y="188" class="m" font-size="9" fill="#777">SpurHacks 2025 · Venture Track</text>
</g>

<!-- animated build-flow -->
<line x1="100" y1="258" x2="1000" y2="258" class="soft"/>
<g class="m small ink">
<text x="95" y="238">IDEA</text>
<text x="305" y="238">PROTOTYPE</text>
<text x="540" y="238">INTEGRATE</text>
<text x="760" y="238">SHIP</text>
<text x="950" y="238">ITERATE</text>
</g>
<g class="m muted" font-size="15">
<text x="205" y="263">→</text><text x="435" y="263">→</text><text x="670" y="263">→</text><text x="855" y="263">→</text>
</g>
<path d="M100 258 H1000" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="3 7" class="moving"/>
<circle r="3" fill="#111">
<animateMotion dur="4.5s" repeatCount="indefinite" path="M100,258 H1000"/>
</circle>

<line x1="35" y1="300" x2="1065" y2="300" class="rule"/>
<text x="35" y="330" class="m tiny muted">BUILD PRINCIPLE</text>
<text x="170" y="330" class="m small ink">USE THE STACK AS TOOLING — LET THE PROJECT DRIVE THE LEARNING</text>
<text x="35" y="365" class="m tiny muted">SIGNAL</text>
<text x="170" y="365" class="m small muted">from product interfaces to AI workflows to lower-level systems</text>
</svg>