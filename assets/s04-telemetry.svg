<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
<defs>
<style>
.m{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
.tiny{font-size:10px;letter-spacing:2.4px}.small{font-size:12px;letter-spacing:.5px}
.ink{fill:#111}.muted{fill:#666}.soft{stroke:#aaa;stroke-width:1}.rule{stroke:#111;stroke-width:1}
@keyframes dash{to{stroke-dashoffset:-80}}
@keyframes pulse{0%,100%{r:2;opacity:.35}50%{r:4;opacity:1}}
.moving{animation:dash 3s linear infinite}.pulse{animation:pulse 1.8s ease-in-out infinite}
</style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>

<text x="24" y="34" class="m tiny ink">04&#160;&#160; ENGINEERING SIGNAL</text>
<line x1="210" y1="28" x2="930" y2="28" class="rule"/>
<text x="965" y="33" class="m tiny muted">/04-DIRECTION</text>
<text x="24" y="64" class="m tiny muted">FOCUS + LEARNING — RELATIVE SIGNALS, NOT SCORES</text>
<text x="1048" y="64" class="m tiny muted" text-anchor="end">LIVE</text>

<!-- left chart: focus -->
<text x="45" y="102" class="m small ink">BUILD FOCUS</text>
<text x="45" y="122" class="m" font-size="9" fill="#777">where the work tends to concentrate</text>

<g class="m small">
<text x="45" y="157" class="ink">PRODUCT</text>
<text x="45" y="190" class="ink">AI</text>
<text x="45" y="223" class="ink">VISION / AUDIO</text>
<text x="45" y="256" class="ink">SYSTEMS</text>
</g>
<g fill="#111">
<rect x="185" y="147" width="185" height="10"/>
<rect x="185" y="180" width="225" height="10"/>
<rect x="185" y="213" width="150" height="10"/>
<rect x="185" y="246" width="105" height="10"/>
</g>
<g stroke="#ccc" stroke-width="1">
<line x1="185" y1="270" x2="500" y2="270"/>
<line x1="185" y1="142" x2="185" y2="270"/>
</g>
<text x="185" y="291" class="m" font-size="8" fill="#777">LOW</text>
<text x="488" y="291" class="m" font-size="8" fill="#777" text-anchor="end">HIGH</text>

<!-- right chart: learning vector -->
<text x="590" y="102" class="m small ink">LEARNING VECTOR</text>
<text x="590" y="122" class="m" font-size="9" fill="#777">direction of the next layer</text>

<line x1="600" y1="260" x2="1050" y2="260" class="soft"/>
<line x1="600" y1="145" x2="600" y2="260" class="soft"/>
<path d="M600 238 C690 232 700 210 760 218 C825 226 835 185 895 178 C955 171 980 140 1050 125"
      fill="none" stroke="#111" stroke-width="1.4"/>
<path d="M600 238 C690 232 700 210 760 218 C825 226 835 185 895 178 C955 171 980 140 1050 125"
      fill="none" stroke="#777" stroke-width="1" stroke-dasharray="3 6" class="moving"/>
<circle cx="1050" cy="125" r="3" fill="#111" class="pulse"/>

<g class="m small">
<text x="600" y="282" class="ink">WEB</text>
<text x="750" y="282" class="muted">AI</text>
<text x="865" y="282" class="muted">C++</text>
<text x="1000" y="282" class="ink">SYSTEMS</text>
</g>
<text x="1050" y="304" class="m" font-size="8" fill="#777" text-anchor="end">→ deeper / lower-level</text>

<line x1="24" y1="330" x2="1076" y2="330" class="rule"/>
<text x="24" y="358" class="m tiny muted">CURRENT DIRECTION</text>
<text x="190" y="358" class="m small ink">C++</text>
<text x="245" y="358" class="m small muted">→</text>
<text x="280" y="358" class="m small ink">COMPILERS</text>
<text x="385" y="358" class="m small muted">→</text>
<text x="420" y="358" class="m small ink">RISC-V</text>
<text x="495" y="358" class="m small muted">→</text>
<text x="530" y="358" class="m small ink">ROBOTICS</text>

<text x="24" y="397" class="m tiny muted">THE GOAL: UNDERSTAND MORE OF THE MACHINE, NOT JUST THE INTERFACE</text>
</svg>